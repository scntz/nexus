[package]
name = "nexus"
version = "1.0.0"
description = "A fast, local-first Windows game launcher"
authors = ["Nexus"]
license = "MIT"
repository = "https://github.com/scntz/nexus"
edition = "2021"
rust-version = "1.90"

[lib]
name = "nexus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "system-proxy"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
notify = { version = "8.2", default-features = false }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
rfd = "0.15"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_JobObjects", "Win32_Security"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
